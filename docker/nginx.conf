#
# The same shape as debian/nginx-snippet.conf, in a container. Terminate TLS
# in front of this, not here: see docker/README.md, "Behind your own TLS".

upstream app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # tickets/attachments.py accepts up to 10 MB per photo and 6 per post.
    # nginx defaults to 1 MB, which turns a phone upload into a bare 413 with
    # no message the pupil can act on.
    client_max_body_size 64m;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
    }

    # Attachments are NEVER served directly: Django re-checks the parent
    # ticket's visibility and then hands the bytes over here (D-21).
    # `internal` means this location cannot be reached from outside.
    # Set ST_X_ACCEL_PREFIX=/protected in the web environment file.
    location /protected/ {
        internal;
        alias /srv/media/;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # A photo taken on a phone over a school Wi-Fi is a slow upload.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
